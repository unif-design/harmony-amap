# 依据 https://github.com/unif-skill/uni-skills/blob/491d2bbc4c4106a1d87de85871e67faf70a856d0/skills/uni-github-delivery/templates/ISSUE_TEMPLATE/feature_request.yml 做原生鸿蒙适配。
name: 功能需求
description: 描述具体场景、目标行为和影响范围。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请描述具体使用场景、目标行为和受影响入口；安全问题按 SECURITY.md 私密报告。
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与问题
      description: 说明触发入口、当前行为和需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 目标行为
      description: 说明期望结果、必要输入输出和验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已有能力与备选方案
      description: 说明已检查的可复用能力或可选方案；没有时可留空。
  - type: textarea
    id: scope
    attributes:
      label: 影响范围
      description: 列出受影响的使用场景、调用方、权限或外部服务；涉及不兼容变化时说明原因。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查现有 Issue，未找到相同需求。
          required: true
        - label: 已说明具体目标行为和范围。
          required: true
